name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: linux-docker
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain from rust-toolchain.toml
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          # rust-toolchain.toml is the only pin; this is a no-op when the
          # toolchain it names is already installed.
          rustup toolchain install
          rustup show active-toolchain
          rustc --version

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --offline --locked -- -D warnings

      - name: Tests
        run: cargo test --offline --locked

      # The contract crate is for every client, a browser's WebAssembly
      # included. The depot is a server and does not build there.
      - name: Check the contract for wasm32-unknown-unknown
        run: cargo check -p kuri-pub --offline --locked --target wasm32-unknown-unknown

      # Both crates for 32-bit ARM, where a depot runs on a small NAS. The
      # depot's TLS compiles C; ring's C needs no libc headers, so clang
      # targeting the platform is enough, without a musl toolchain.
      - name: Check for armv7-unknown-linux-musleabihf
        run: |
          if ! command -v clang >/dev/null 2>&1; then
            SUDO=$(command -v sudo || true)
            $SUDO apt-get update -qq
            $SUDO apt-get install -y -qq clang
          fi
          export CC_armv7_unknown_linux_musleabihf=clang
          export CFLAGS_armv7_unknown_linux_musleabihf=--target=armv7-unknown-linux-musleabihf
          export AR_armv7_unknown_linux_musleabihf=ar
          cargo check --workspace --offline --locked --target armv7-unknown-linux-musleabihf
